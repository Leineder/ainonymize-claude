name: Smoke test

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/smoke.mjs
      - name: Neural runtime installs the way Claude Code installs it (lockfile, no scripts)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "const o = await import('onnxruntime-web'); if (!o.InferenceSession) throw new Error('ort'); console.log('onnxruntime-web ok')"
